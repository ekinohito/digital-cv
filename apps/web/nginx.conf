server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Admin supports file uploads up to 10 MiB.
    # Leave a little extra room for multipart overhead.
    client_max_body_size 12m;

    # -------------------------------------------------------------------------
    # Container health
    # -------------------------------------------------------------------------

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # Backend
    # -------------------------------------------------------------------------

    # Keep GraphQL on the same origin as the frontend.
    #
    # Browser:
    #   https://portfolio.example.com/graphql
    #
    # Internal Docker request:
    #   http://api:3000/graphql
    location /graphql {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # REST endpoints:
    #
    # /api/health
    # /api/assets/:id
    # /api/admin/assets
    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Vite assets
    # -------------------------------------------------------------------------

    # Vite filenames are content-hashed, so they can be cached practically
    # forever.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never aggressively cache the entry HTML because it points to the
    # current content-hashed JS/CSS bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------------------
    # React Router SPA fallback
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
