name: digital-card

services:
  # ===========================================================================
  # CockroachDB
  # ===========================================================================

  cockroach:
    image: cockroachdb/cockroach:v26.2.2
    command:
      - start-single-node
      - --insecure
      - --http-addr=0.0.0.0:8080
      - --store=/cockroach/cockroach-data

    environment:
      COCKROACH_DATABASE: portfolio

    volumes:
      - cockroach-data:/cockroach/cockroach-data

    ports:
      # SQL — useful for local debugging.
      - "${COCKROACH_SQL_PORT:-26257}:26257"

      # CockroachDB web console.
      - "${COCKROACH_HTTP_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cockroach sql --insecure --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    restart: unless-stopped

    networks:
      - app


  # ===========================================================================
  # MinIO
  # ===========================================================================

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    volumes:
      - minio-data:/data

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

    restart: unless-stopped

    networks:
      - app


  # ===========================================================================
  # Create S3 bucket
  #
  # One-shot container. It exits successfully once MinIO is reachable and the
  # required bucket exists.
  # ===========================================================================

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-portfolio}

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "Configuring MinIO client..."

        mc alias set \
          local \
          http://minio:9000 \
          "$$MINIO_ROOT_USER" \
          "$$MINIO_ROOT_PASSWORD"

        echo "Verifying MinIO credentials..."

        mc admin info local

        echo "Creating bucket '$$S3_BUCKET'..."

        mc mb \
          --ignore-existing \
          "local/$$S3_BUCKET"

        echo "MinIO initialized."

    restart: "no"

    networks:
      - app


  # ===========================================================================
  # Database migrations + initial seed
  #
  # Another one-shot container.
  # ===========================================================================

  db-init:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: migrate

    environment:
      NODE_ENV: production

      DATABASE_URL: >-
        postgresql://root@cockroach:26257/portfolio?sslmode=disable

    depends_on:
      cockroach:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "Applying database migrations..."
        pnpm exec prisma migrate deploy

        echo "Applying initial seed..."
        pnpm run db:seed

        echo "Database initialized."

    restart: "no"

    networks:
      - app


  # ===========================================================================
  # NestJS
  # ===========================================================================

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime

    init: true

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: >-
        postgresql://root@cockroach:26257/portfolio?sslmode=disable

      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN}

      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-portfolio}

      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      # Required for MinIO and many other S3-compatible implementations.
      S3_FORCE_PATH_STYLE: "true"

    depends_on:
      db-init:
        condition: service_completed_successfully

      minio-init:
        condition: service_completed_successfully

    # Optional, but useful while reviewing/debugging the test assignment.
    ports:
      - "${API_PORT:-3000}:3000"

    restart: unless-stopped

    networks:
      - app


  # ===========================================================================
  # React / Nginx
  # ===========================================================================

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime

    init: true

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${WEB_PORT:-8088}:8080"

    restart: unless-stopped

    networks:
      - app


# =============================================================================
# Persistent storage
# =============================================================================

volumes:
  cockroach-data:
  minio-data:


# =============================================================================
# Network
# =============================================================================

networks:
  app:
    driver: bridge
